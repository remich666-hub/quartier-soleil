const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:u8(IV)},key,u8(CT));const html=new TextDecoder().decode(pt);document.open();document.write(html);document.close();}
document.getElementById('f').addEventListener('submit',async ev=>{ev.preventDefault();const pw=document.getElementById('p').value;try{await open(pw);if(document.getElementById('r')&&document.getElementById('r').checked)try{localStorage.setItem('qs-key',pw)}catch(_){}}catch(_){document.getElementById('e').textContent='Mot de passe incorrect.';}});
(async()=>{try{const s=localStorage.getItem('qs-key');if(s)await open(s);}catch(_){try{localStorage.removeItem('qs-key')}catch(__){}}})();
</script></body></html>
